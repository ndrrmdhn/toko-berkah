<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Dashboard</title>

  <!-- GOOGLE FONT -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- FONT AWESOME -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
  >

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="assets/css/main.css"
  >

  <link
    rel="stylesheet"
    href="assets/css/admin.css"
  >

</head>

<body>

  <div class="dashboard-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="sidebar-brand">
        Toko Berkah
      </div>

      <nav class="sidebar-menu">

        <a href="#" class="active">
          <i class="fa-solid fa-box"></i>
          Produk
        </a>

        <a href="#">
          <i class="fa-solid fa-chart-line"></i>
          Statistik
        </a>

        <a href="#">
          <i class="fa-solid fa-gear"></i>
          Pengaturan
        </a>

      </nav>

    </aside>

    <!-- MAIN -->
    <div class="main-content">

      <!-- TOPBAR -->
      <header class="topbar">

        <div>
          <h2>Dashboard Admin</h2>
          <p>Kelola produk toko</p>
        </div>

        <div class="topbar-right">

          <span id="admin-name"></span>

          <button
            id="logout-btn"
            class="btn btn-dark"
          >
            Logout
          </button>

        </div>

      </header>

      <!-- STATS -->
      <section class="stats-grid">

        <div class="stat-card">
          <h3 id="total-products">0</h3>
          <p>Total Produk</p>
        </div>

        <div class="stat-card">
          <h3 id="total-stock">0</h3>
          <p>Total Stok</p>
        </div>

      </section>

      <!-- TOOLBAR -->
      <section class="toolbar">

        <input
          type="text"
          id="search-input"
          placeholder="Cari produk..."
        >

        <div id="empty-state" class="empty-state hidden">
          Belum ada produk
        </div>

        <button
          id="add-product-btn"
          class="btn btn-primary"
        >
          + Tambah Produk
        </button>

      </section>

      <!-- TABLE -->
      <div class="table-wrapper">

        <table class="product-table">

          <thead>

            <tr>
              <th>Produk</th>
              <th>Harga</th>
              <th>Stok</th>
              <th>Kategori</th>
              <th>Aksi</th>
            </tr>

          </thead>

          <tbody id="product-table-body"></tbody>

        </table>

      </div>

      <!-- EMPTY -->
      <div
        id="empty-state"
        class="empty-state hidden"
      >

        <i class="fa-solid fa-box-open"></i>

        <h3>Belum Ada Produk</h3>

        <p>
          Tambahkan produk pertama Anda
        </p>

      </div>

    </div>

  </div>

  <!-- MODAL -->
  <div
    id="product-modal"
    class="modal hidden"
  >

    <div class="modal-content">

      <div class="modal-header">

        <h2 id="modal-title">
          Tambah Produk
        </h2>

        <button id="close-modal-btn">
          ✕
        </button>

      </div>

      <form id="product-form">

        <div class="form-group">

          <label>Nama Produk</label>

          <input
            type="text"
            id="product-name"
            required
          >

        </div>

        <div class="form-group">

          <label>Harga</label>

          <input
            type="number"
            id="product-price"
            min="1"
            required
          >

        </div>

        <div class="form-group">

          <label>Stok</label>

          <input
            type="number"
            id="product-stock"
            min="0"
            required
          >

        </div>

        <div class="form-group">

          <label>Kategori</label>

          <select id="product-category">

            <option>Sembako</option>
            <option>Snack</option>
            <option>Minuman</option>

          </select>

        </div>

        <div class="form-group">

          <label>Deskripsi</label>

          <textarea
            id="product-description"
          ></textarea>

        </div>

        <div class="form-group">

          <label>URL Gambar</label>

          <input
            type="url"
            id="product-image"
          >

        </div>

        <!-- PREVIEW -->
        <div class="image-preview">

          <img
            id="preview-image"
            src="https://placehold.co/300x200"
            alt="Preview"
          >

        </div>

        <button
          type="submit"
          id="submit-btn"
          class="btn btn-primary full"
        >
          Simpan Produk
        </button>

      </form>

    </div>

  </div>

  <!-- TOAST -->
  <div id="toast"></div>

  <!-- JS -->
  <script src="assets/js/core/storage.js"></script>
  <script src="assets/js/core/state.js"></script>

  <script src="assets/js/services/auth.service.js"></script>
  <script src="assets/js/services/product.service.js"></script>

  <script src="assets/js/ui/modal.js"></script>
  <script src="assets/js/ui/toast.js"></script>

  <script src="assets/js/pages/admin.js"></script>

</body>
</html>
